<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery Elzomor</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0d1f2d;
    font-family: 'Cairo', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }

  /* Subtle animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(200, 50, 60, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(200, 50, 60, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(13, 31, 45, 0) 0%, #0d1f2d 100%);
    animation: bgPulse 8s ease-in-out infinite alternate;
    z-index: 0;
  }

  @keyframes bgPulse {
    0%   { opacity: 0.6; }
    100% { opacity: 1; }
  }

  /* Floating particles */
  .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .particle {
    position: absolute;
    width: 2px; height: 2px;
    background: rgba(200, 50, 60, 0.35);
    border-radius: 50%;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem;
    width: 100%;
    max-width: 480px;
  }

  /* Logo circle */
  .logo-wrap {
    width: 130px; height: 130px;
    border-radius: 50%;
    background: #16303f;
    border: 2px solid rgba(212,175,90,0.5);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 1.4rem;
    animation: fadeDown 0.7s ease both, logoGlow 3.5s ease-in-out infinite;
    overflow: hidden;
  }
  .logo-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    animation: logoBreathe 4.5s ease-in-out infinite;
  }

  @keyframes logoGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(212,175,90,0.15); }
    50%      { box-shadow: 0 0 36px rgba(212,175,90,0.35); }
  }
  @keyframes logoBreathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.035); }
  }

  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    color: #d4af5a;
    letter-spacing: 2px;
    animation: fadeDown 0.8s ease 0.1s both;
    text-align: center;
    text-shadow: 0 0 18px rgba(212,175,90,0.25);
  }
  .brand-name span {
    background: linear-gradient(135deg, #f3d98a, #c9a24b 55%, #9c7a2f);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .brand-sub {
    font-size: 0.8rem;
    color: rgba(232,224,213,0.45);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 2.5rem;
    animation: fadeDown 0.8s ease 0.2s both;
  }

  /* Divider */
  .divider {
    width: 60px; height: 1px;
    background: linear-gradient(to right, transparent, rgba(200,50,60,0.6), transparent);
    margin-bottom: 2.2rem;
    animation: fadeDown 0.8s ease 0.3s both;
  }

  /* Link cards */
  .links { width: 100%; display: flex; flex-direction: column; gap: 1rem; }

  .link-card {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.3rem;
    background: rgba(22, 48, 63, 0.7);
    border: 1px solid rgba(200,50,60,0.2);
    border-radius: 14px;
    text-decoration: none;
    color: #e8e0d5;
    transition: all 0.3s ease;
    backdrop-filter: blur(6px);
    position: relative;
    overflow: hidden;
  }

  .link-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(200,50,60,0.08), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .link-card:hover {
    border-color: rgba(200,50,60,0.55);
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.35), 0 0 0 1px rgba(200,50,60,0.15);
  }
  .link-card:hover::before { opacity: 1; }

  .link-card:nth-child(1) { animation: slideUp 0.7s ease 0.4s both; }
  .link-card:nth-child(2) { animation: slideUp 0.7s ease 0.55s both; }
  .link-card:nth-child(3) { animation: slideUp 0.7s ease 0.7s both; }
  .link-card:nth-child(4) { animation: slideUp 0.7s ease 0.85s both; }

  .icon-wrap {
    width: 46px; height: 46px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.3s;
  }
  .link-card:hover .icon-wrap { transform: scale(1.08); }

  .icon-wrap.fb { background: rgba(24, 119, 242, 0.15); border: 1px solid rgba(24,119,242,0.25); }
  .icon-wrap.tt { background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.1); }
  .icon-wrap.tg { background: rgba(39, 174, 239, 0.12); border: 1px solid rgba(39,174,239,0.25); }
  .icon-wrap.ig { background: rgba(225, 48, 108, 0.12); border: 1px solid rgba(225,48,108,0.25); }

  .icon-wrap svg { width: 24px; height: 24px; }

  .link-text { flex: 1; }
  .link-label { font-size: 0.72rem; color: rgba(232,224,213,0.45); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 2px; }
  .link-name { font-size: 1rem; font-weight: 600; color: #e8e0d5; }

  .arrow {
    color: rgba(200,50,60,0.6);
    font-size: 1.1rem;
    transition: transform 0.3s, color 0.3s;
  }
  .link-card:hover .arrow { transform: translateX(-4px); color: #c8323c; }

  /* Footer */
  .footer {
    margin-top: 2.5rem;
    font-size: 0.72rem;
    color: rgba(232,224,213,0.2);
    letter-spacing: 1px;
    animation: fadeDown 1s ease 0.9s both;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
